<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Profile Search</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px 15px;
    }

    .box {
      max-width: 450px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
    }

    input {
      width: 90%;
      padding: 12px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #000;
      color: white;
      cursor: pointer;
    }

    #result {
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>TikTok Profile</h1>

    <p>اپنا TikTok Username درج کریں</p>

    <input type="text" id="username" placeholder="@username">

    <br>

    <button onclick="searchProfile()">Search</button>

    <div id="result"></div>
  </div>

  <script>
    function searchProfile() {
      const username = document.getElementById("username").value.trim();

      if (!username) {
        document.getElementById("result").innerHTML =
          "<p>براہ کرم Username درج کریں۔</p>";
        return;
      }

      document.getElementById("result").innerHTML =
        "<p>Profile search تیار ہے۔ TikTok API کو بعد میں یہاں connect کریں گے۔</p>";
    }
  </script>

</body>
</html>
